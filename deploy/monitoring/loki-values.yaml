# loki-stack values — Loki + Promtail for log aggregation in Kind
# Promtail auto-discovers all pod logs via the Kubernetes API and ships to Loki.
loki:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: false  # in-memory for local Kind cluster

promtail:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# Don't pull Grafana again — kube-prometheus-stack already provides it
grafana:
  enabled: false
