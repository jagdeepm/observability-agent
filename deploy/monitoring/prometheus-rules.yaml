# PrometheusRules — alert definitions for the OpenTelemetry Demo.
# These fire when the demo app misbehaves, which triggers the agent's investigation.
#
# Two groups: recording rules normalise the source metrics, alerts read the
# normalised series. That indirection earns its keep because the metric names are a
# moving target — the demo's services span nine languages at different semconv
# versions, and the spanmetrics connector is mid-migration from milliseconds to
# seconds. Rather than pin one name and discover it was wrong after a ten-minute
# cluster build, the recording rule accepts whichever series exists.
#
# `task discover-metrics` prints what the running Prometheus actually has.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-demo-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # -----------------------------------------------------------------------
    # Recording rules — one canonical series per concept, in base units.
    # -----------------------------------------------------------------------
    - name: otel-demo-recording
      interval: 15s
      rules:
        # P99 server-side latency, in seconds, per service.
        #
        # Preference order: the spanmetrics connector (produced by the collector,
        # so uniform across every language in the demo), then the stable HTTP
        # semconv metric emitted by the SDKs directly. `or` takes the first
        # non-empty vector, so exactly one of these contributes per service.
        - record: otel:service_latency_p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (service_name, le) (
              rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m])
            )) / 1000
            or
            histogram_quantile(0.99, sum by (service_name, le) (
              rate(traces_span_metrics_duration_seconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m])
            ))
            or
            histogram_quantile(0.99, sum by (service_name, le) (
              rate(http_server_request_duration_seconds_bucket[5m])
            ))

        # Fraction of server calls ending in error, per service. Span status is set
        # by the SDKs for 5xx responses and unhandled RPC errors alike, so this
        # covers the demo's gRPC services as well as its HTTP ones.
        - record: otel:service_error_ratio
          expr: |
            sum by (service_name) (
              rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])
            )
            /
            clamp_min(sum by (service_name) (
              rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])
            ), 0.001)

    # -----------------------------------------------------------------------
    # Alerts — all routed to the agent's webhook by alertmanager-config.yaml.
    # -----------------------------------------------------------------------
    - name: otel-demo
      interval: 15s
      rules:
        - alert: HighLatency
          expr: otel:service_latency_p99_seconds > 0.5
          for: 1m
          labels:
            severity: critical
            service: '{{ $labels.service_name }}'
            cluster: kind-e2e
          annotations:
            summary: '{{ $labels.service_name }} P99 latency > 500ms'
            description: 'P99 latency for {{ $labels.service_name }} is {{ $value | humanizeDuration }} over the last 5 minutes.'

        - alert: HighErrorRate
          expr: otel:service_error_ratio > 0.1
          for: 1m
          labels:
            severity: critical
            service: '{{ $labels.service_name }}'
            cluster: kind-e2e
          annotations:
            summary: '{{ $labels.service_name }} error rate > 10%'
            description: '{{ $labels.service_name }} has a {{ $value | humanizePercentage }} error rate over the last 5 minutes.'

        # ---- Pod-level alerts (kube-state-metrics / cAdvisor) ----
        # These read the cluster, not the demo's instrumentation, so they fire
        # even when the OTLP pipeline is misconfigured.
        - alert: PodRestarting
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="otel-demo"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
            service: '{{ $labels.container }}'
            cluster: kind-e2e
          annotations:
            summary: 'Pod {{ $labels.pod }} is restarting'
            description: '{{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times in the last 10 minutes.'

        - alert: HighCPU
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{namespace="otel-demo", container!=""}[5m])
            ) > 0.4
          for: 1m
          labels:
            severity: warning
            service: '{{ $labels.container }}'
            cluster: kind-e2e
          annotations:
            summary: '{{ $labels.container }} CPU usage is high'
            description: 'Container {{ $labels.container }} has been using {{ $value | humanize }} cores for the last 5 minutes.'

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{namespace="otel-demo", condition="true"} == 0
          for: 2m
          labels:
            severity: warning
            cluster: kind-e2e
          annotations:
            summary: 'Pod {{ $labels.pod }} is not ready'
            description: 'Pod {{ $labels.pod }} has failed its readiness probe for over 2 minutes.'
