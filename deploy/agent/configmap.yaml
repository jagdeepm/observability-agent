# Agent configuration — environment variables and LLM settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: observability-agent
data:
  # LLM provider — set to "false" for real LLM, "true" for mock responses
  LLM_MOCK: "false"
  LLM_MODEL: "openai:gpt-4o"
  # LLM_API_KEY and LLM_BASE_URL come from the agent-secrets Secret
  MAX_CONCURRENT_INVESTIGATIONS: "3"
  STALE_THRESHOLD_HOURS: "1"
  # Observability source endpoints
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  LOKI_URL: "http://loki.monitoring.svc.cluster.local:3100"
  TEMPO_URL: "http://tempo.monitoring.svc.cluster.local:3200"
  PYTHONUNBUFFERED: "1"
  # Log level — INFO shows investigation progress, DEBUG adds LLM/HTTP traces
  LOG_LEVEL: "INFO"