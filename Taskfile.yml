# Taskfile — end-to-end setup, deploy, and test automation for the observability agent.
# Requires: task (https://taskfile.dev), kind, kubectl, helm
# Docker runtime: auto-detects Colima or Docker Desktop. Override with DOCKER_RUNTIME env var.
#
# Quick start:
#   task all              # Full pipeline: runtime → cluster → monitoring → demo → agent → e2e
#   task e2e-setup        # Everything except running tests
#   task e2e-test         # Run e2e tests only (cluster must be ready)
#   task teardown         # Destroy the cluster
#
# Runtime (macOS):
#   task runtime-start    # Auto-detect and start Docker runtime (Colima preferred)
#   task runtime-status   # Show which runtime is active
#
# LLM configuration:
#   cp .env.example .env && $EDITOR .env                 # LiteLLM proxy URL + key
#   task all                                              # picks .env up automatically
#
# Without an LLM_API_KEY the agent is deployed in mock mode (`serve --mock-llm`),
# which uses canned responses and needs no network.

version: '3'

# Loaded into every task's environment. A variable already exported in the shell
# takes precedence, so `export LLM_API_KEY=... && task all` still works.
dotenv: ['.env']

vars:
  CLUSTER_NAME: observability-e2e
  MONITORING_NS: monitoring
  AGENT_NS: observability-agent
  DEMO_NS: otel-demo
  AGENT_IMAGE: observability-agent:local
  # Every task that imports project code (pytest, httpx, observability_agent
  # itself) goes through this, not a bare `python`/`python3` — Task runs each
  # command in its own subprocess, which does not inherit an activated venv
  # from the shell that ran `task`. Relying on ambient PATH meant `task all`
  # failed with "python: executable file not found" for anyone whose system
  # has no bare `python`, and would have failed one step later with
  # ModuleNotFoundError even with `python3`, since the system interpreter has
  # none of this project's dependencies installed. `task env-init`'s and
  # CONTRIBUTING.md's own quick start both require .venv to exist first.
  PYTHON: '{{.PYTHON | default ".venv/bin/python"}}'
  # Pinned — the demo renames services and feature flags between majors, and the
  # e2e tests and alert rules are written against this version (app 3.0.0).
  DEMO_CHART_VERSION: '{{.DEMO_CHART_VERSION | default "0.41.0"}}'
  TEMPO_CHART_VERSION: '{{.TEMPO_CHART_VERSION | default "1.24.4"}}'
  # Colima resource defaults — tune for your machine
  COLIMA_CPUS: '{{.COLIMA_CPUS | default 6}}'
  COLIMA_MEMORY: '{{.COLIMA_MEMORY | default 12}}'
  COLIMA_DISK: '{{.COLIMA_DISK | default 60}}'

# ---------------------------------------------------------------------------
# Full pipeline
# ---------------------------------------------------------------------------

tasks:
  all:
    desc: Full pipeline — runtime, cluster, monitoring, loki, tempo, demo, agent, e2e tests
    cmds:
      - task: runtime-start
      - task: cluster
      - task: monitoring
      - task: loki
      - task: tempo
      - task: demo
      - task: agent-build
      - task: agent-deploy
      - task: port-forward
      - task: e2e-test

  e2e-setup:
    desc: Everything except running e2e tests
    cmds:
      - task: runtime-start
      - task: cluster
      - task: monitoring
      - task: loki
      - task: tempo
      - task: demo
      - task: agent-build
      - task: agent-deploy
      - task: port-forward

  env-init:
    desc: Create .env from .env.example if it does not exist
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists — leaving it alone"
        else
          cp .env.example .env
          echo "Created .env — fill in LLM_BASE_URL, LLM_API_KEY and LLM_MODEL"
        fi

  # -------------------------------------------------------------------------
  # Runtime (Colima / Docker Desktop)
  # -------------------------------------------------------------------------

  runtime-start:
    desc: Auto-detect and start Docker runtime (Colima preferred on macOS, Docker Desktop fallback)
    cmds:
      - |
        RUNTIME="{{.DOCKER_RUNTIME}}"
        if [ "$RUNTIME" = "docker-desktop" ]; then
          echo "Using Docker Desktop (explicit)"
          if ! docker ps >/dev/null 2>&1; then
            echo "ERROR: Docker Desktop is not running. Start it and retry."
            exit 1
          fi
        elif [ "$RUNTIME" = "colima" ]; then
          echo "Using Colima (explicit)"
          if ! command -v colima >/dev/null 2>&1; then
            echo "Installing colima..."
            brew install colima docker
          fi
          if ! colima status 2>/dev/null | grep -q "Running"; then
            echo "Starting Colima (cpus={{.COLIMA_CPUS}}, memory={{.COLIMA_MEMORY}}GiB, disk={{.COLIMA_DISK}}GiB)..."
            colima start --cpu {{.COLIMA_CPUS}} --memory {{.COLIMA_MEMORY}} --disk {{.COLIMA_DISK}} --network-address --kubernetes=false
          else
            echo "Colima is already running"
          fi
          # Ensure docker CLI points at colima
          docker context use colima 2>/dev/null || true
        else
          # Auto-detect: prefer Colima if installed, else Docker Desktop
          if command -v colima >/dev/null 2>&1; then
            echo "Colima detected — using Colima"
            if ! colima status 2>/dev/null | grep -q "Running"; then
              echo "Starting Colima (cpus={{.COLIMA_CPUS}}, memory={{.COLIMA_MEMORY}}GiB, disk={{.COLIMA_DISK}}GiB)..."
              colima start --cpu {{.COLIMA_CPUS}} --memory {{.COLIMA_MEMORY}} --disk {{.COLIMA_DISK}} --network-address --kubernetes=false
            else
              echo "Colima is already running"
            fi
            docker context use colima 2>/dev/null || true
          elif docker ps >/dev/null 2>&1; then
            echo "Docker Desktop detected and running"
          else
            echo "No Docker runtime found."
            echo "Install Colima:  brew install colima docker"
            echo "Or start Docker Desktop and retry."
            exit 1
          fi
        fi
        echo "Docker runtime: $(docker context inspect --format '{{.Name}}' 2>/dev/null || echo 'default')"
        docker ps >/dev/null 2>&1 && echo "Docker is ready" || { echo "ERROR: Docker is not responding"; exit 1; }

  runtime-status:
    desc: Show which Docker runtime is active
    cmds:
      - |
        echo "Docker context: $(docker context inspect --format '{{.Name}}' 2>/dev/null || echo 'unknown')"
        echo "Docker socket:  ${DOCKER_HOST:-unix:///var/run/docker.sock}"
        docker info 2>/dev/null | grep -E "Server Version|Operating System|Total Memory|CPUs" || echo "Docker not reachable"
        echo ""
        if command -v colima >/dev/null 2>&1; then
          echo "Colima:"
          colima status 2>/dev/null || echo "  not installed"
        fi

  runtime-stop:
    desc: Stop the Docker runtime
    cmds:
      - |
        if command -v colima >/dev/null 2>&1 && colima status 2>/dev/null | grep -q "Running"; then
          colima stop
          echo "Colima stopped"
        else
          echo "No Colima instance running"
        fi

  # -------------------------------------------------------------------------
  # Cluster
  # -------------------------------------------------------------------------

  cluster:
    desc: Create Kind cluster
    deps: [runtime-start]
    cmds:
      - |
        if kind get clusters 2>/dev/null | grep -q "^{{.CLUSTER_NAME}}$"; then
          echo "Cluster {{.CLUSTER_NAME}} already exists"
        else
          echo "Creating Kind cluster '{{.CLUSTER_NAME}}'..."
          kind create cluster --name {{.CLUSTER_NAME}} --config deploy/kind-config.yaml
          echo "Waiting for cluster to be ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
        fi
        echo "Cluster context: $(kubectl config current-context)"
        echo "Nodes:"
        kubectl get nodes

  # -------------------------------------------------------------------------
  # Monitoring stack
  # -------------------------------------------------------------------------

  monitoring:
    desc: Deploy kube-prometheus-stack with Alertmanager → agent webhook
    deps: [cluster]
    cmds:
      - |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
        helm repo update
        kubectl create ns {{.MONITORING_NS}} --dry-run=client -o yaml | kubectl apply -f -

      - |
        echo "Deploying kube-prometheus-stack..."
        helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
          --namespace {{.MONITORING_NS}} \
          --values deploy/monitoring/kube-prometheus-values.yaml \
          --wait --timeout 5m

      - kubectl apply -f deploy/monitoring/prometheus-rules.yaml
      - kubectl apply -f deploy/monitoring/alertmanager-config.yaml

      - |
        echo "Waiting for Prometheus and Alertmanager to be ready..."
        kubectl wait --for=condition=Ready pods -n {{.MONITORING_NS}} \
          -l app.kubernetes.io/name=prometheus --timeout=120s || true
        kubectl wait --for=condition=Ready pods -n {{.MONITORING_NS}} \
          -l app.kubernetes.io/name=alertmanager --timeout=120s || true

  loki:
    desc: Deploy Loki + Promtail for log aggregation (ships all pod logs to Grafana)
    deps: [cluster]
    cmds:
      - |
        helm repo add grafana https://grafana.github.io/helm-charts 2>/dev/null || true
        helm repo update
        kubectl create ns {{.MONITORING_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        echo "Deploying loki-stack (Loki + Promtail)..."
        helm upgrade --install loki grafana/loki-stack \
          --namespace {{.MONITORING_NS}} \
          --values deploy/monitoring/loki-values.yaml \
          --wait --timeout 5m
      - |
        echo "Waiting for Loki to be ready..."
        kubectl wait --for=condition=Ready pods -n {{.MONITORING_NS}} \
          -l app=loki --timeout=120s || true
      - |
        # loki-stack always sets isDefault: true on its datasource ConfigMap,
        # which conflicts with Prometheus (also isDefault: true) and crashes Grafana.
        # Patch it to false so Prometheus stays the default.
        kubectl patch configmap loki-loki-stack -n {{.MONITORING_NS}} --type=merge \
          -p '{"data":{"loki-stack-datasource.yaml":"apiVersion: 1\ndatasources:\n- name: Loki\n  type: loki\n  access: proxy\n  url: \"http://loki:3100\"\n  version: 1\n  isDefault: false\n  jsonData:\n    {}\n"}}' 2>/dev/null || true
        echo "Loki ready — logs available in Grafana under the Loki datasource"

  tempo:
    desc: Deploy Tempo (trace backend for the TraceAgent)
    deps: [cluster]
    cmds:
      - |
        helm repo add grafana https://grafana.github.io/helm-charts 2>/dev/null || true
        helm repo update grafana
        kubectl create ns {{.MONITORING_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        echo "Deploying Tempo {{.TEMPO_CHART_VERSION}}..."
        helm upgrade --install tempo grafana/tempo \
          --namespace {{.MONITORING_NS}} \
          --version {{.TEMPO_CHART_VERSION}} \
          --values deploy/monitoring/tempo-values.yaml \
          --wait --timeout 5m
      - |
        kubectl wait --for=condition=Ready pods -n {{.MONITORING_NS}} \
          -l app.kubernetes.io/name=tempo --timeout=120s || true
        echo "Tempo ready — query API on tempo.{{.MONITORING_NS}}:3200, OTLP gRPC on :4317"

  # -------------------------------------------------------------------------
  # OpenTelemetry Demo
  # -------------------------------------------------------------------------

  demo:
    desc: Deploy OpenTelemetry Astronomy Shop demo application
    deps: [cluster]
    cmds:
      - |
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts 2>/dev/null || true
        helm repo update open-telemetry
        kubectl create ns {{.DEMO_NS}} --dry-run=client -o yaml | kubectl apply -f -

      - |
        # Fault injection patches flagd-config with kubectl, which takes
        # server-side-apply ownership of .data and makes every later
        # `helm upgrade` fail with a field-ownership conflict. Dropping the
        # ConfigMap hands it back; Helm recreates it with the shipped defaults,
        # which is what redeploying the demo should mean anyway.
        kubectl delete configmap flagd-config -n {{.DEMO_NS}} --ignore-not-found
      - |
        echo "Deploying OTEL demo {{.DEMO_CHART_VERSION}}..."
        helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
          --namespace {{.DEMO_NS}} \
          --version {{.DEMO_CHART_VERSION}} \
          --values deploy/monitoring/otel-demo-values.yaml \
          --wait --timeout 15m

      - |
        echo "Waiting for OTEL demo pods..."
        kubectl wait --for=condition=Ready pods -n {{.DEMO_NS}} --all --timeout=300s || true
        echo "Demo services:"
        kubectl get svc -n {{.DEMO_NS}}

  # -------------------------------------------------------------------------
  # Agent
  # -------------------------------------------------------------------------

  agent-build:
    desc: Build the observability-agent Docker image and load into Kind
    deps: [runtime-start]
    cmds:
      - docker build -t {{.AGENT_IMAGE}} -f deploy/agent/Dockerfile .
      - kind load docker-image {{.AGENT_IMAGE}} --name {{.CLUSTER_NAME}}

  agent-deploy:
    desc: Deploy the observability agent to the cluster
    deps: [agent-build]
    cmds:
      - kubectl apply -f deploy/agent/namespace.yaml
      - kubectl apply -f deploy/agent/rbac.yaml
      - kubectl apply -f deploy/agent/configmap.yaml
      - task: llm-config
      - |
        kubectl create secret generic agent-secrets \
          --namespace {{.AGENT_NS}} \
          --from-literal=LLM_API_KEY="${LLM_API_KEY:-}" \
          --from-literal=LLM_BASE_URL="${LLM_BASE_URL:-}" \
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f deploy/agent/deployment.yaml
      - kubectl apply -f deploy/agent/service.yaml
      - |
        echo "Waiting for agent to be ready..."
        kubectl wait --for=condition=Ready pods -n {{.AGENT_NS}} \
          -l app=observability-agent --timeout=120s || true
        echo "Agent pods:"
        kubectl get pods -n {{.AGENT_NS}}

  llm-check:
    desc: Verify the .env LLM endpoint, model name, and structured output
    cmds:
      - |
        {{.PYTHON}} deploy/scripts/llm-check.py

  llm-models:
    desc: List the model names the configured LLM endpoint offers
    cmds:
      - |
        {{.PYTHON}} deploy/scripts/llm-check.py --list

  llm-config:
    desc: Push LLM_MODEL / LLM_MOCK from the environment (.env) into the agent ConfigMap
    cmds:
      - |
        # LLM_MODEL is hardcoded in configmap.yaml; without this patch a model name
        # from .env would never reach the pod.
        #
        # LLM_MOCK is derived from the key rather than read from .env on purpose:
        # LLM_MOCK=true in-cluster gives real agents wired to a MockLLMProvider with
        # no registered responses, so every agent call raises KeyError. Mock mode is
        # only meaningful via `serve --mock-llm`, which swaps the agents out too.
        if [ -n "${LLM_API_KEY:-}" ]; then MOCK=false; else MOCK=true; fi
        kubectl patch configmap agent-config -n {{.AGENT_NS}} --type merge -p "$(
          printf '{"data":{"LLM_MODEL":"%s","LLM_MOCK":"%s"}}' "${LLM_MODEL:-openai:gpt-4o}" "$MOCK"
        )"
        if [ "$MOCK" = "true" ]; then
          echo "No LLM_API_KEY found — agent will start in mock mode."
          echo "  Set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL in .env (see .env.example)."
        else
          echo "LLM: ${LLM_MODEL:-openai:gpt-4o} via ${LLM_BASE_URL:-the provider default}"
        fi

  agent-configure-llm:
    desc: Re-read .env, push the LLM key/model to the running agent, and restart it
    cmds:
      - |
        if [ -z "${LLM_API_KEY:-}" ]; then
          echo "ERROR: LLM_API_KEY is not set."
          echo "Run 'task env-init' and fill in .env, or export LLM_API_KEY=sk-..."
          exit 1
        fi
      - |
        kubectl create secret generic agent-secrets \
          --namespace {{.AGENT_NS}} \
          --from-literal=LLM_API_KEY="${LLM_API_KEY}" \
          --from-literal=LLM_BASE_URL="${LLM_BASE_URL:-}" \
          --dry-run=client -o yaml | kubectl apply -f -
      - task: llm-config
      - |
        kubectl rollout restart deployment/observability-agent -n {{.AGENT_NS}}
      - |
        kubectl rollout status deployment/observability-agent -n {{.AGENT_NS}} --timeout=120s

  agent-use-mock:
    desc: Switch the agent back to mock mode (no LLM API key needed)
    cmds:
      - |
        kubectl patch configmap agent-config -n {{.AGENT_NS}} -p '{"data": {"LLM_MOCK": "true"}}'
      - |
        kubectl rollout restart deployment/observability-agent -n {{.AGENT_NS}}
      - |
        kubectl wait --for=condition=Ready pods -n {{.AGENT_NS}} -l app=observability-agent --timeout=60s
      - |
        echo "Agent switched to mock mode"

  # -------------------------------------------------------------------------
  # Local run — the agent on this machine, against port-forwarded backends.
  # No image rebuild, so LLM/prompt changes are a restart away instead of a
  # docker build + kind load + rollout.
  # -------------------------------------------------------------------------

  run-local:
    desc: Run the agent locally against port-forwarded backends (needs task port-forward)
    cmds:
      - |
        if [ -z "${LLM_API_KEY:-}" ]; then
          echo "ERROR: LLM_API_KEY is not set. Run 'task env-init' and fill in .env."
          exit 1
        fi
        echo "Agent on http://127.0.0.1:8081"
        echo "  Prometheus: ${PROMETHEUS_URL:-http://localhost:9091}"
        echo "  Loki:       ${LOKI_URL:-http://localhost:3100}"
        echo "  Tempo:      ${TEMPO_URL:-http://localhost:3200}"
        echo "  LLM:        ${LLM_MODEL:-openai:gpt-4o} via ${LLM_BASE_URL:-provider default}"
        PROMETHEUS_URL="${PROMETHEUS_URL:-http://localhost:9091}" \
        LOKI_URL="${LOKI_URL:-http://localhost:3100}" \
        TEMPO_URL="${TEMPO_URL:-http://localhost:3200}" \
        observability-agent serve --host 127.0.0.1 --port 8081

  send-test-alert:
    desc: POST a sample Alertmanager payload to the local agent (task run-local)
    vars:
      SERVICE: '{{.SERVICE | default "cart"}}'
      ALERTNAME: '{{.ALERTNAME | default "HighErrorRate"}}'
    cmds:
      - |
        # Alertmanager in the cluster cannot reach your laptop, so the local agent
        # is fed by hand.
        curl -sS -X POST http://127.0.0.1:8081/alerts \
          -H 'Content-Type: application/json' \
          -d '{
                "status": "firing",
                "alerts": [{
                  "status": "firing",
                  "labels": {
                    "alertname": "{{.ALERTNAME}}",
                    "service": "{{.SERVICE}}",
                    "namespace": "{{.DEMO_NS}}",
                    "severity": "critical",
                    "cluster": "kind-e2e"
                  },
                  "annotations": {
                    "summary": "{{.SERVICE}} error rate > 10%",
                    "description": "Sent by task send-test-alert"
                  },
                  "fingerprint": "local-test-{{.SERVICE}}"
                }]
              }' | python3 -m json.tool
        echo "Watch: curl -s http://127.0.0.1:8081/incidents | python3 -m json.tool"

  agent-logs:
    desc: Stream agent logs
    cmds:
      - kubectl logs -n {{.AGENT_NS}} -l app=observability-agent -f

  agent-restart:
    desc: Restart the agent deployment
    cmds:
      - kubectl rollout restart deployment/observability-agent -n {{.AGENT_NS}}

  # -------------------------------------------------------------------------
  # Port forwarding (all host access goes through kubectl port-forward)
  # -------------------------------------------------------------------------

  port-forward:
    desc: Start port-forwarding for agent API, demo, and Prometheus
    cmds:
      - |
        echo "Starting port-forwards..."
        for port in 8080 9090 9091 3100 3200; do
          lsof -ti:$port 2>/dev/null | xargs kill -9 2>/dev/null && echo "  Freed port $port" || true
        done
        kubectl port-forward -n {{.AGENT_NS}} svc/observability-agent 8080:8000 &
        echo $! > /tmp/agent-port-forward.pid
        kubectl port-forward -n {{.DEMO_NS}} svc/frontend-proxy 9090:8080 2>/dev/null &
        echo $! > /tmp/demo-port-forward.pid
        kubectl port-forward -n {{.MONITORING_NS}} svc/kube-prometheus-stack-prometheus 9091:9090 2>/dev/null &
        echo $! > /tmp/prometheus-port-forward.pid
        kubectl port-forward -n {{.MONITORING_NS}} svc/loki 3100:3100 2>/dev/null &
        echo $! > /tmp/loki-port-forward.pid
        kubectl port-forward -n {{.MONITORING_NS}} svc/tempo 3200:3200 2>/dev/null &
        echo $! > /tmp/tempo-port-forward.pid
        echo "Port-forwards started:"
        echo "  Agent API:    http://localhost:8080"
        echo "  Demo:         http://localhost:9090"
        echo "  Prometheus:   http://localhost:9091"
        echo "  Loki:         http://localhost:3100"
        echo "  Tempo:        http://localhost:3200"
        sleep 2

  stop-port-forward:
    desc: Stop all port-forwards
    cmds:
      - |
        for f in /tmp/agent-port-forward.pid /tmp/demo-port-forward.pid \
                 /tmp/prometheus-port-forward.pid /tmp/loki-port-forward.pid \
                 /tmp/tempo-port-forward.pid; do
          if [ -f "$f" ]; then
            kill $(cat "$f") 2>/dev/null || true
            rm "$f"
          fi
        done
        echo "Port-forwards stopped"

  # -------------------------------------------------------------------------
  # Fault injection
  # -------------------------------------------------------------------------

  inject-fault:
    desc: 'Flip a flagd feature flag. Usage: task inject-fault -- cartFailure 100%'
    cmds:
      - |
        # Same code path the e2e tests use, so a flag rename breaks both at once.
        {{.PYTHON}} -c 'import sys; from tests.e2e.helpers import set_flag; set_flag(*sys.argv[1:])' {{.CLI_ARGS}}
        echo "Check alerts: http://localhost:9091/api/v1/alerts"

  list-faults:
    desc: List the flagd feature flags available in the deployed demo
    cmds:
      - |
        {{.PYTHON}} -c 'from tests.e2e.helpers import list_flags; [print(f"{k:28} {v}") for k, v in list_flags().items()]'

  reset-faults:
    desc: Return every flagd flag to its shipped default
    cmds:
      - |
        {{.PYTHON}} -c 'from tests.e2e.helpers import reset_flags; reset_flags()'
      - echo "All flags reset"

  inject-crash:
    desc: Kill an ad pod to trigger restart detection
    cmds:
      - |
        POD=$(kubectl get pods -n {{.DEMO_NS}} -l app.kubernetes.io/name=ad -o jsonpath='{.items[0].metadata.name}')
        echo "Deleting pod: $POD"
        kubectl delete pod -n {{.DEMO_NS}} "$POD"
        echo "Check alerts: http://localhost:9091/api/v1/alerts"

  # -------------------------------------------------------------------------
  # E2E tests
  # -------------------------------------------------------------------------

  e2e-test:
    desc: Run end-to-end tests against the deployed cluster
    cmds:
      - |
        echo "Running e2e tests..."
        AGENT_URL=http://localhost:8080 \
        PROMETHEUS_URL=http://localhost:9091 \
        {{.PYTHON}} -m pytest tests/e2e/ -v -m e2e --tb=long --timeout={{.E2E_TIMEOUT | default 1800}}

  e2e-test-one:
    desc: 'Run a subset of the e2e tests. Usage: task e2e-test-one -- tests/e2e/test_error_faults.py'
    cmds:
      - |
        AGENT_URL=http://localhost:8080 \
        PROMETHEUS_URL=http://localhost:9091 \
        {{.PYTHON}} -m pytest {{.CLI_ARGS}} -v -m e2e --tb=long --timeout={{.E2E_TIMEOUT | default 1800}}

  # -------------------------------------------------------------------------
  # Smoke test
  # -------------------------------------------------------------------------

  telemetry-check:
    desc: Verify demo telemetry is actually reaching Prometheus, Loki and Tempo
    cmds:
      - |
        # The single most useful diagnostic: if the demo's collector is not
        # exporting into our stack, the latency and error alerts can never fire
        # and every e2e test times out for reasons that look like agent bugs.
        fail=0
        echo "=== Prometheus: demo services reporting ==="
        svcs=$(curl -s 'http://localhost:9091/api/v1/label/service_name/values' \
          | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).get("data") or []))' 2>/dev/null)
        if [ -z "$svcs" ]; then
          echo "  NONE — demo metrics are not reaching Prometheus."
          echo "  Check: kubectl logs -n {{.DEMO_NS}} -l opentelemetry.io/name=otel-collector | grep -i export"
          fail=1
        else
          echo "  $svcs"
        fi

        echo "=== Prometheus: HTTP server duration metric ==="
        curl -s 'http://localhost:9091/api/v1/label/__name__/values' \
          | python3 -c 'import json,sys; print("\n".join("  "+m for m in json.load(sys.stdin).get("data") or [] if "http_server" in m)) or None' 2>/dev/null \
          || { echo "  none found"; fail=1; }

        echo "=== Tempo: traces present ==="
        n=$(curl -s 'http://localhost:3200/api/search?limit=5' \
          | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("traces") or []))' 2>/dev/null || echo 0)
        [ "$n" -gt 0 ] && echo "  $n traces" || { echo "  NONE — check the otlp_grpc/jaeger exporter endpoint"; fail=1; }

        echo "=== Loki: labels present ==="
        curl -s 'http://localhost:3100/loki/api/v1/labels' \
          | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data") or []; print("  "+", ".join(d) if d else "  NONE")' 2>/dev/null \
          || { echo "  Loki not reachable"; fail=1; }

        echo ""
        [ $fail -eq 0 ] && echo "Telemetry is flowing." || { echo "Telemetry is NOT flowing — fix this before running e2e tests."; exit 1; }

  discover-metrics:
    desc: Show the metric names and service names Prometheus actually has
    cmds:
      - |
        # The alert rules in deploy/monitoring/prometheus-rules.yaml normalise over
        # several possible source metrics. Use this to see which one is live.
        echo "=== Latency/error source metrics present ==="
        curl -s 'http://localhost:9091/api/v1/label/__name__/values' \
          | python3 -c 'import json,sys; [print("  "+m) for m in json.load(sys.stdin).get("data") or [] if "span_metrics" in m or "http_server" in m]'
        echo "=== service_name values ==="
        curl -s 'http://localhost:9091/api/v1/label/service_name/values' \
          | python3 -c 'import json,sys; [print("  "+m) for m in json.load(sys.stdin).get("data") or []]'
        echo "=== recording rules evaluating ==="
        for r in otel:service_latency_p99_seconds otel:service_error_ratio; do
          echo "  $r:"
          curl -s --get 'http://localhost:9091/api/v1/query' --data-urlencode "query=$r" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]["result"]; [print(f"    {s[\"metric\"].get(\"service_name\",\"?\"):20} {s[\"value\"][1]}") for s in d] or print("    (empty)")'
        done

  smoke-test:
    desc: Quick smoke test — verify all components are reachable
    cmds:
      - |
        echo "=== Agent Health ==="
        curl -s http://localhost:8080/health | python3 -m json.tool || echo "Agent not reachable"
        echo ""
        echo "=== Active Incidents ==="
        curl -s http://localhost:8080/incidents | python3 -m json.tool || echo "No incidents"
        echo ""
        echo "=== Prometheus Alerts ==="
        curl -s http://localhost:9091/api/v1/alerts 2>/dev/null | python3 -m json.tool 2>/dev/null | head -30 || echo "Prometheus not reachable"
        echo ""
        echo "=== Memory Store ==="
        curl -s http://localhost:8080/memory/incidents | python3 -m json.tool || echo "No archived incidents"

  # -------------------------------------------------------------------------
  # Teardown
  # -------------------------------------------------------------------------

  teardown:
    desc: Destroy the Kind cluster and stop port-forwards
    cmds:
      - task: stop-port-forward
      - kind delete cluster --name {{.CLUSTER_NAME}}
      - echo "Cluster {{.CLUSTER_NAME}} deleted"

  teardown-all:
    desc: Destroy cluster, stop runtime, clean everything
    cmds:
      - task: stop-port-forward
      - kind delete cluster --name {{.CLUSTER_NAME}} 2>/dev/null || true
      - task: runtime-stop
      - echo "All cleaned up"

  # -------------------------------------------------------------------------
  # Status
  # -------------------------------------------------------------------------

  status:
    desc: Show cluster and component status
    cmds:
      - echo "=== Docker Runtime ==="
      - docker context inspect --format '{{.Name}}' 2>/dev/null || echo "  unknown"
      - echo ""
      - echo "=== Kind Clusters ==="
      - kind get clusters 2>/dev/null || echo "  (none)"
      - echo ""
      - echo "=== Nodes ==="
      - kubectl get nodes 2>/dev/null || echo "  (cluster not reachable)"
      - echo ""
      - echo "=== Namespaces ==="
      - kubectl get ns {{.MONITORING_NS}} {{.DEMO_NS}} {{.AGENT_NS}} 2>/dev/null || echo "  Some namespaces missing"
      - echo ""
      - echo "=== Agent Pods ==="
      - kubectl get pods -n {{.AGENT_NS}} 2>/dev/null || echo "  No agent pods"
      - echo ""
      - echo "=== OTEL Demo Pods ==="
      - kubectl get pods -n {{.DEMO_NS}} 2>/dev/null || echo "  No demo pods"
      - echo ""
      - echo "=== Alerts ==="
      - curl -s http://localhost:9091/api/v1/alerts 2>/dev/null | python3 deploy/scripts/count-alerts.py 2>/dev/null || echo "  Prometheus not reachable"

  # -------------------------------------------------------------------------
  # Prerequisites check
  # -------------------------------------------------------------------------

  prereqs:
    desc: Check that all required tools are installed
    cmds:
      - |
        echo "Checking prerequisites..."
        missing=0
        for cmd in kind kubectl helm python3; do
          if command -v $cmd >/dev/null 2>&1; then
            echo "  ✓ $cmd ($(command -v $cmd))"
          else
            echo "  ✗ $cmd — NOT FOUND"
            missing=1
          fi
        done
        # Check for at least one Docker runtime
        if command -v colima >/dev/null 2>&1; then
          echo "  ✓ colima ($(command -v colima))"
        elif docker ps >/dev/null 2>&1; then
          echo "  ✓ docker ($(command -v docker))"
        else
          echo "  ✗ No Docker runtime found. Install colima: brew install colima docker"
          missing=1
        fi
        if [ $missing -eq 1 ]; then
          echo ""
          echo "Install missing tools:"
          echo "  brew install kind kubectl helm colima docker python@3.12"
          exit 1
        fi
        echo "All prerequisites met."